name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node majors that are not yet end-of-life (https://nodejs.org/en/about/previous-releases).
        # Drop a version when it reaches end of life and add the next one when it is released.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # dist/ is committed, so it must match what src/ builds to (bun 1.4.2 produced it).
      - run: bun run check-dist

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate ./plugins/aws-guard --strict
      - run: claude plugin validate . --strict
